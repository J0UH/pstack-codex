name: Verify port
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: python3 scripts/build.py --check
      - run: python3 -m pip install -r requirements-test.txt
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/package.py --check
      - run: bun install --frozen-lockfile
        working-directory: skills/poteto-mode/scripts
      - run: bun test orch watch-pr
        working-directory: skills/poteto-mode/scripts
